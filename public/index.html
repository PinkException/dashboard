<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project dashboard</title>
<style>
  /* Spec 009-01: Console-direction theme, matching the v1.2 redline token
     cascade (docs/designs/dashboard-v1.2/redlines/base.md). The redline is
     dark-only, so :root below carries a DERIVED light palette (each dark
     token's role/contrast preserved — background/surface/text/border ramp
     inverted, accent hues kept but re-lit for a light surface); the
     `@media (prefers-color-scheme: dark)` block below restores the redline's
     dark values verbatim (spec 009-01 follow-up, owner-requested). Fonts use
     a monospace/sans system-font stack rather than a Google Fonts import —
     the dashboard is a local, potentially offline tool (ADR-0001 zero-dep)
     and nothing here should require a network fetch beyond /api/data. */
  :root {
    --canvas: #f4f5f7;
    --sheet: #edeff2; --topbar: #eff1f4; --hover: #dfe3e9; --inset: #d1d7df;
    --track: #d6dbe1; --border: #d6dbe1; --border-soft: #e2e6eb; --border-faint: #e8ebef;
    --border-strong: #c5cdd5; --border-dash: #c4ccd4; --ok-border: #afdbcb;
    --warn-bg: #efeaed; --dot-border: #afbac5; --dot-off: #bec7d0;
    --text: #1f2328; --text-white: #080a0d; --text-hi: #0b0e11; --text-body: #161b20;
    --text-bright: #272e36; --text-item: #434b55; --text-subhead: #535b65;
    --text-muted: #636b75; --text-dim: #6f7883; --text-dim2: #848e99; --text-dimmer: #7f8894;
    --text-label: #8c95a0; --text-faint: #a1aab5; --text-faintest: #afb7c2;
    --green: #3cb37a; --blue: #1766b3; --amber: #b27519; --orange: #a42f10;
    --red: #9e0f1d; --blocked-bg: #efe5e8; --blocked-border: #e2c5ca; --red-soft: #3d0d13;
    --link: #2f5b90; --link-hover: #173e70; --link-dim: #5777a0; --purple: #3f1773;
    --draft: #5f6774; --abandoned: #aa8590; --stale: #c5a575; --warn-text: #614817;
    --heat-clear: var(--text-faint); --heat-light: var(--text-muted);
    --heat-busy: var(--amber); --heat-hot: var(--orange);
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #08090b;
      --sheet: #0d0f12; --topbar: #0b0d10; --hover: #161a20; --inset: #20262e;
      --track: #1e2329; --border: #1e2329; --border-soft: #14181d; --border-faint: #101317;
      --border-strong: #2a323a; --border-dash: #2b333b; --ok-border: #245040;
      --warn-bg: #151013; --dot-border: #3a4550; --dot-off: #2f3841;
      --text: #d7dbe0; --text-white: #f2f4f7; --text-hi: #eef1f4; --text-body: #dfe4e9;
      --text-bright: #c9d0d8; --text-item: #aab2bc; --text-subhead: #9aa2ac;
      --text-muted: #8a929c; --text-dim: #7c8590; --text-dim2: #66707b; --text-dimmer: #6b7480;
      --text-label: #5f6873; --text-faint: #4a535e; --text-faintest: #3d4550;
      --green: #4cc38a; --blue: #4c9be8; --amber: #e6a94d; --orange: #ef7a5b;
      --red: #f0616f; --blocked-bg: #1a1013; --blocked-border: #3a1d22; --red-soft: #f2c2c8;
      --link: #6f9bd0; --link-hover: #8fb6e8; --link-dim: #5f7fa8; --purple: #b48ce8;
      --draft: #8b93a0; --abandoned: #7a5560; --stale: #8a6a3a; --warn-text: #e8cf9e;
    }
  }
  * { box-sizing: border-box; }
  html, body { background: var(--canvas); }
  body {
    margin: 0; padding: 24px; color: var(--text);
    font: 14px/1.5 var(--sans);
  }
  #app { max-width: 1360px; margin: 0 auto; }
  .toolbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; max-width: 1360px; margin: 0 auto 10px; }
  .toolbar .meta { font-size: 11px; color: var(--text-label); font-family: var(--mono); }
  button { background: none; border: 1px solid var(--border-strong); border-radius: 6px; color: var(--text-subhead); font: 12px var(--mono); padding: 5px 11px; cursor: pointer; }
  button:hover { background: var(--hover); }

  .sheet { background: var(--sheet); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .err { color: var(--red); padding: 20px; }

  /* --- summary band + header --- */
  .summary-band { display: flex; justify-content: space-between; align-items: center; padding: 22px 26px; border-bottom: 1px solid var(--border); }
  .summary-path { font: 11px var(--mono); color: var(--text-label); letter-spacing: 0.04em; }
  .summary-title { font: 600 21px/1.2 var(--sans); color: var(--text-hi); margin-top: 4px; }
  .summary-stats { display: flex; align-items: center; }
  .stat-cell { padding: 0 22px; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .stat-cell .stat-count { font: 600 26px/0.9 var(--mono); color: var(--text-hi); }
  .stat-cell .stat-label { font: 10px var(--mono); letter-spacing: 0.13em; color: var(--text-label); text-transform: uppercase; }
  .running-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; animation: cpulse 1.8s ease-in-out infinite; }
  @keyframes cpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .col-header { display: grid; grid-template-columns: 3px 248px minmax(300px,1fr) 132px 140px 150px; column-gap: 20px; padding: 11px 26px; border-bottom: 1px solid var(--border); font: 10px var(--mono); letter-spacing: 0.12em; color: var(--text-label); text-transform: uppercase; }

  /* --- overview rows --- */
  .project-list { display: flex; flex-direction: column; }
  .project-row { display: grid; grid-template-columns: 3px 248px minmax(300px,1fr) 132px 140px 150px; column-gap: 20px; align-items: center; min-height: 104px; padding: 0 26px; border-top: 1px solid var(--border-soft); cursor: pointer; }
  .project-row:hover { background: var(--hover); }
  .row-gutter { align-self: stretch; width: 3px; margin: 21px 0; border-radius: 2px; background: transparent; }
  .row-project { display: flex; flex-direction: column; gap: 7px; }
  .row-name { font: 600 15px var(--mono); color: var(--text-hi); }
  .row-type { font: 12.5px var(--sans); color: var(--text-muted); }
  .chip { align-self: flex-start; font: 400 9.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border-radius: 8px; border: 1px solid var(--border-strong); color: var(--text-muted); }
  .chip-active { color: var(--text-muted); border-color: var(--border-strong); }
  .chip-done { color: var(--green); border-color: var(--ok-border); }
  .chip-error { color: var(--red); border-color: var(--blocked-border); }
  .chip-muted { color: var(--text-faint); border-color: var(--border-soft); }
  .chip-current { color: var(--green); border-color: var(--ok-border); font-size: 9px; }

  .row-nextmove .row-action { font: 400 14px/1.35 var(--sans); color: var(--text-bright); }
  .row-action.muted { color: var(--text-dim); font-style: italic; }

  /* Spec 009-02 AC1: the waiting-on verb badge — You-states (DECIDE/REVIEW/
     MERGE) carry the strongest emphasis, Ready calmer; Idle renders no badge
     at all (nextMoveCell falls back to the plain compass line — the
     quietest state, per AC1). Selectors below are keyed on the exact state
     name render.mjs emits as `rv-${state}` — renaming a state in
     deriveWaitingOn (src/lib.mjs) must rename its selector here too. */
  .row-verb { display: inline-block; font: 700 10.5px var(--mono); letter-spacing: 0.09em; text-transform: uppercase; margin-right: 9px; padding: 2px 8px; border-radius: 4px; vertical-align: middle; }
  .rv-DECIDE, .rv-REVIEW, .rv-MERGE { color: var(--red); background: var(--blocked-bg); border: 1px solid var(--blocked-border); }
  .rv-REVIEW { color: var(--amber); }
  .rv-MERGE { color: var(--green); border-color: var(--ok-border); }
  .rv-Ready { color: var(--blue); background: transparent; border: 1px solid var(--border-strong); }
  /* Spec 009-04: External (a PR out for someone else's review) is recessive —
     quieter than the You-states, louder than Idle (which shows no badge). */
  .rv-External { color: var(--text-muted); background: transparent; border: 1px solid var(--border-soft); }

  /* Spec 009-04: detail-view open-PR list. */
  .prs { margin-top: 14px; }
  .pr-row { display: flex; align-items: baseline; gap: 9px; padding: 3px 0; font: 12px var(--mono); }
  .pr-link { color: var(--blue); text-decoration: none; }
  .pr-title { color: var(--text-subhead); }
  .pr-hint { color: var(--text-faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; }

  .row-inflight { display: flex; flex-direction: column; gap: 7px; }
  .if-num { font: 600 26px/0.9 var(--mono); }
  .if-word { font: 10px var(--mono); text-transform: uppercase; margin-left: 4px; }
  .if-caption { font: 9.5px var(--mono); letter-spacing: 0.06em; color: var(--text-faint); }
  .heat-clear { color: var(--heat-clear); }
  .heat-light { color: var(--heat-light); }
  .heat-busy { color: var(--heat-busy); }
  .heat-hot { color: var(--heat-hot); }
  .flight-cells { display: block; }

  .row-progress { display: flex; flex-direction: column; gap: 8px; }
  .row-progress .pct { font: 500 16px var(--mono); color: var(--text-bright); }
  .row-progress .caption { font: 11px var(--mono); color: var(--text-label); margin-left: 6px; }

  .row-activity { display: flex; flex-direction: column; gap: 7px; font: 12px var(--mono); }
  .act-primary { color: var(--text-bright); display: block; }
  .act-last { color: var(--text-label); font-size: 11.5px; display: block; }

  /* --- detail view --- */
  .detail { background: var(--sheet); }
  .topbar { background: var(--topbar); padding: 13px 26px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
  .back-btn { border-radius: 5px; padding: 5px 11px; }
  .crumb { font: 12px var(--mono); color: var(--text-subhead); }
  .header { padding: 24px 26px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 18px; }
  .detail-title-line { display: flex; align-items: center; gap: 12px; }
  .detail-title { font: 600 25px var(--sans); color: var(--text-hi); }
  .detail-type { font: 11px var(--mono); color: var(--text-muted); }
  .detail-meta { margin-top: 9px; font: 12px var(--mono); color: var(--text-label); }
  .tabs { margin-top: 14px; display: flex; gap: 2px; }
  .tab { font: 12.5px var(--mono); padding: 9px 16px; border-bottom: 2px solid transparent; color: var(--text-dimmer); cursor: pointer; }
  .tab.active { color: var(--text-hi); border-bottom-color: var(--amber); }
  .tab.disabled { cursor: default; }
  .progress-readout { text-align: right; }
  .readout-text { font: 13px var(--mono); color: var(--text-bright); }

  .whats-next { padding: 20px 26px; border-bottom: 1px solid var(--border-soft); }
  .wn-header { display: flex; justify-content: space-between; align-items: baseline; }
  .wn-header .label, .label { font: 10px var(--mono); letter-spacing: 0.14em; color: var(--text-label); text-transform: uppercase; }
  .wn-header .age { font: 11px var(--mono); color: var(--text-label); }
  .wn-header .age.stale { color: var(--stale); }
  .wn-line { font: 16px/1.5 var(--sans); color: var(--text-body); max-width: 960px; margin-top: 6px; }
  .wn-line.muted { color: var(--text-muted); }
  .wn-next { margin-top: 8px; font: 14px var(--sans); color: var(--text-bright); }
  .wn-blocked { margin-top: 10px; background: var(--blocked-bg); border: 1px solid var(--blocked-border); border-radius: 6px; padding: 11px 14px; font: 14px var(--sans); color: var(--red-soft); }
  .label-inline { font: 11px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--green); margin-right: 6px; }
  .wn-blocked .label-inline { color: var(--red); }

  .counts-line { padding: 14px 26px; border-bottom: 1px solid var(--border-soft); font: 12.5px var(--mono); color: var(--text-muted); }

  .two-col { display: grid; grid-template-columns: 1.35fr 1fr; gap: 1px; background: var(--track); border-bottom: 1px solid var(--border); }
  .specs-panel, .ws-panel { background: var(--sheet); padding: 20px 26px; }
  .specs-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .track-label, .specs-toggle { font: 11px var(--mono); color: var(--link); cursor: pointer; }
  .spec-row { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 14px; padding: 8px 0; align-items: center; }
  .spec-n { font: 12.5px var(--mono); color: var(--text-label); }
  .spec-name { font: 13.5px var(--mono); color: var(--text-hi); }
  .spec-name.dim { color: var(--text-dimmer); }
  .spec-slices { font: 12.5px var(--mono); color: var(--text-muted); }
  .spec-status { font: 11px var(--mono); }
  .st-DONE { color: var(--green); } .st-IN_PROGRESS { color: var(--blue); }
  .st-DRAFT { color: var(--draft); } .st-ABANDONED { color: var(--abandoned); }
  .st-DEFERRED { color: var(--text-dimmer); }

  .ws-block { border-top: 1px solid var(--border-soft); padding: 12px 0; }
  .ws-block:first-of-type { border-top: none; }
  .ws-title-line { display: flex; align-items: center; gap: 12px; }
  .ws-title { font: 500 14px var(--sans); color: var(--text-body); }
  .ws-kind { font: 10.5px var(--mono); color: var(--purple); letter-spacing: 0.03em; }
  .ws-items { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .ws-item { font: 13px var(--sans); color: var(--text-item); }
  .discovered { margin-top: 12px; border-top: 1px solid var(--border-soft); padding-top: 12px; }
  .discovered-line { font: 13px var(--sans); color: var(--text-muted); }

  .sessions { padding: 20px 26px; border-bottom: 1px solid var(--border-soft); }
  .sessions-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .sessions-header .meta { font: 12px var(--mono); color: var(--text-muted); }
  .session-row { display: grid; grid-template-columns: 18px 1.3fr 1.4fr 1fr auto; column-gap: 14px; padding: 9px 0; border-top: 1px solid var(--border-soft); align-items: center; }
  .session-row.older { opacity: 0.72; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
  .dot-run { background: var(--green); animation: cpulse 1.8s ease-in-out infinite; }
  .dot-idle { background: var(--dot-off); }
  .dot-hollow { background: transparent; border: 1px solid var(--dot-border); }
  .sr-title { font: 13.5px var(--sans); color: var(--text-hi); }
  .sr-branch { font: 12px var(--mono); color: var(--link); }
  .sr-worktree { font: 12px var(--mono); color: var(--text-muted); }
  .sr-last { font: 12px var(--mono); color: var(--text-label); text-align: right; }
  .sessions-toggle summary { cursor: pointer; margin-top: 8px; font: 12px var(--mono); color: var(--link); list-style: none; }
  .sessions-toggle summary::-webkit-details-marker { display: none; }

  .warning { padding: 14px 26px; background: var(--warn-bg); border-bottom: 1px solid var(--border-soft); }
  .warning { font: 13.5px var(--sans); color: var(--warn-text); }
  .warning-eg { font: 12px var(--mono); color: var(--text-muted); margin-top: 4px; }

  /* Reserved Activity tab (AC6) — inert, dashed placeholder. */
  .activity-tab-content { padding: 60px 26px; text-align: center; }
  .activity-icon { width: 52px; height: 52px; margin: 0 auto 14px; border: 1px dashed var(--border-dash); border-radius: 12px; }
  .activity-heading { font: 16px var(--sans); color: var(--text-bright); }
  .activity-desc { margin-top: 6px; font: 12.5px var(--sans); color: var(--text-muted); }
</style>
</head>
<body>
<div class="toolbar"><span class="meta" id="scanned"></span><button id="refresh">refresh</button></div>
<div id="app"><div class="sheet"><p class="err" style="color:var(--text-muted)">scanning…</p></div></div>
<script type="module">
import * as R from './render.mjs';

const app = document.getElementById('app');
const scannedEl = document.getElementById('scanned');

// App state — kept in the same shape render.mjs's pure detail-state helpers
// use (view/path/showAll), so the click glue below is a thin dispatcher over
// tested pure functions, not ad hoc DOM bookkeeping (plan.md's testability
// decision; AC4).
let state = { ...R.OVERVIEW_STATE };
let projects = [];
let generatedAt = null;

function overviewHtml() {
  // Spec 009-02 AC2: finish-first ordering — MERGE > REVIEW > DECIDE >
  // Ready(resume) > Ready(start) > External > Idle, via each project's
  // waitingOn.rank (derived scan-side, src/lib.mjs's deriveWaitingOn).
  const rows = R.sortProjectsByWaitingOn(projects).map(R.overviewRow).join('');
  const running = R.runningNowCount(projects);
  return `<div class="sheet">
    <div class="summary-band">
      <div>
        <div class="summary-path">~/projects</div>
        <div class="summary-title">Overview</div>
      </div>
      <div class="summary-stats">
        <div class="stat-cell"><span class="stat-count"><span class="running-dot"></span>${running}</span><span class="stat-label">RUNNING NOW</span></div>
      </div>
    </div>
    <div class="col-header"><span></span><span>PROJECT</span><span>NEXT MOVE</span><span>IN FLIGHT</span><span>PROGRESS</span><span>ACTIVITY</span></div>
    <div class="project-list">${rows || '<p style="padding:20px 26px;color:var(--text-muted)">No projects configured.</p>'}</div>
  </div>`;
}

function render() {
  if (state.view === 'detail') {
    const p = projects.find((pr) => pr.path === state.path);
    app.innerHTML = p ? R.detailView(p, { showAll: state.showAll }) : overviewHtml();
    if (!p) state = R.closeDetail();
  } else {
    app.innerHTML = overviewHtml();
  }
}

app.addEventListener('click', (e) => {
  const back = e.target.closest('[data-action="back"]');
  if (back) { state = R.closeDetail(); render(); return; }
  const toggle = e.target.closest('[data-action="show-all-specs"], [data-action="show-track-specs"]');
  if (toggle) { state = { ...state, showAll: toggle.dataset.action === 'show-all-specs' }; render(); return; }
  const activityTab = e.target.closest('[data-action="show-activity-tab"]');
  if (activityTab) {
    const content = app.querySelector('.overview-tab-content');
    const activity = app.querySelector('.activity-tab-content');
    const overviewTab = app.querySelector('[data-action="show-overview-tab"]');
    if (content && activity) {
      content.hidden = true; activity.hidden = false;
      activityTab.classList.add('active'); if (overviewTab) overviewTab.classList.remove('active');
    }
    return;
  }
  const overviewTabBtn = e.target.closest('[data-action="show-overview-tab"]');
  if (overviewTabBtn) {
    const content = app.querySelector('.overview-tab-content');
    const activity = app.querySelector('.activity-tab-content');
    const activityTabBtn = app.querySelector('[data-action="show-activity-tab"]');
    if (content && activity) {
      content.hidden = false; activity.hidden = true;
      overviewTabBtn.classList.add('active'); if (activityTabBtn) activityTabBtn.classList.remove('active');
    }
    return;
  }
  const row = e.target.closest('.project-row');
  if (row) { state = R.openDetail(row.dataset.path); render(); return; }
});

async function load() {
  const res = await fetch('/api/data');
  const data = await res.json();
  if (data.error) {
    app.innerHTML = `<div class="sheet"><p class="err">${R.esc(data.error)}</p></div>`;
    return;
  }
  projects = data.projects;
  generatedAt = data.generatedAt;
  scannedEl.textContent = 'scanned ' + new Date(generatedAt).toLocaleString();
  render();
}

document.getElementById('refresh').addEventListener('click', load);
load();
setInterval(load, 120000);
</script>
</body>
</html>
