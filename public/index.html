<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Spec 014-01: v1.3 "readable" look (docs/designs/dashboard-v1.3/). Light
     palette in :root, dark values from Main-dark.dc.html in the media query;
     no hard-coded colour anywhere else (the old token names below are kept as
     aliases of the new palette so the detail/queue/roadmap views, restyled in
     014-02/014-03, follow the shared tokens automatically). Nunito loads from
     Google Fonts (owner decision D1); the stack falls back offline. */
  :root {
    --canvas: #F4EFE4; --surface: #FBF8F1; --inset: #EFE7D6; --border: #E4DAC7;
    --text: #1C2A47; --muted: #4E5A7C;
    --accent: #E16B43; --accent-strong: #B04A24;
    --ok: #2F8A63; --ok-strong: #23704F; --idle: #625C4E; --external: #3F5379;
    --danger: #B5372B; --warn: #8A5A08; --dot-off: #C9BFAA;
    --row-owner: #FDF6EE; --row-idle: #F7F3EA; --blocked-bg: #FCEFE9;
    --chip-you-bg: #FBE3D8; --chip-you-fg: #A3401C;
    --chip-merge-bg: #E2EFE7; --chip-merge-fg: #23704F;
    --chip-ready-bg: #E2EFE7; --chip-ready-fg: #23704F;
    --chip-external-bg: #E7E9F0; --chip-external-fg: #3F5379;
    --chip-idle-bg: #ECE7DB; --chip-idle-fg: #625C4E;
    --lens-active-bg: #1C2A47; --lens-active-fg: #FBF8F1; --lens-track: #EFE7D6;
    --on-danger: #FFFFFF;
    --shadow: 0 1px 2px rgba(28,42,71,.05), 0 6px 20px rgba(28,42,71,.06);
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: 'Nunito', ui-rounded, system-ui, sans-serif;
    --heat-hot: var(--accent-strong); --heat-busy: var(--warn); --heat-light: var(--text); --heat-clear: var(--muted);
    /* aliases for views not yet restyled */
    --sheet: var(--surface); --topbar: var(--surface); --hover: var(--inset); --track: var(--border);
    --border-soft: var(--border); --border-faint: var(--border); --border-strong: var(--border); --border-dash: var(--border);
    --ok-border: var(--ok); --warn-bg: var(--inset); --warn-text: var(--text); --dot-border: var(--muted);
    --text-white: var(--text); --text-hi: var(--text); --text-body: var(--text); --text-bright: var(--text);
    --text-item: var(--muted); --text-subhead: var(--muted); --text-muted: var(--muted); --text-dim: var(--muted);
    --text-dim2: var(--muted); --text-dimmer: var(--muted); --text-label: var(--muted); --text-faint: var(--muted); --text-faintest: var(--muted);
    --green: var(--ok); --blue: var(--accent-strong); --amber: var(--accent); --orange: var(--accent-strong);
    --red: var(--danger); --blocked-border: var(--border); --red-soft: var(--text);
    --link: var(--accent-strong); --link-hover: var(--text); --link-dim: var(--muted); --purple: var(--muted);
    --draft: var(--idle); --abandoned: var(--muted); --stale: var(--accent-strong);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #121A2B; --surface: #1A2338; --inset: #232E48; --border: #2C374F;
      --text: #EFE9DC; --muted: #A9B3CA;
      --accent: #EE7E56; --accent-strong: #F08A63;
      --ok: #5BBB8D; --ok-strong: #7DD3A8; --idle: #C9C2B2; --external: #B4C3E6;
      --danger: #FFB497; --warn: #E3AC44; --dot-off: #4A5470;
      --row-owner: #1F2539; --row-idle: #161E31; --blocked-bg: #2B1F27;
      --chip-you-bg: #4A2618; --chip-you-fg: #FFB497;
      --chip-merge-bg: #1B3830; --chip-merge-fg: #7DD3A8;
      --chip-ready-bg: #1B3830; --chip-ready-fg: #7DD3A8;
      --chip-external-bg: #26314C; --chip-external-fg: #B4C3E6;
      --chip-idle-bg: #2A303E; --chip-idle-fg: #C9C2B2;
      --lens-active-bg: #EFE9DC; --lens-active-fg: #1A2338; --lens-track: #232E48;
      --on-danger: #121A2B;
      --shadow: 0 1px 2px rgba(0,0,0,.25), 0 6px 20px rgba(0,0,0,.28);
    }
  }
  * { box-sizing: border-box; }
  html, body { background: var(--canvas); }
  body { margin: 0; padding: clamp(20px, 4vw, 52px); color: var(--text); font-size: 15px; line-height: 1.5; font-family: 'Nunito', ui-rounded, system-ui, sans-serif; }
  #app { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px; }
  .toolbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; max-width: 1240px; margin: 0 auto 10px; }
  .toolbar .meta { font-size: 13px; color: var(--muted); }
  button { background: var(--surface); border: 1px solid var(--border); border-radius: 999px; color: var(--text); font: 700 15px var(--sans); min-height: 44px; padding: 0 20px; cursor: pointer; }
  button:hover { background: var(--inset); }
  a { color: var(--text); text-decoration: none; }
  a:hover { color: var(--accent-strong); }

  .sheet { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; }
  .err { color: var(--danger); padding: 20px; }

  /* --- header --- */
  .hdr { display: flex; gap: 22px; align-items: center; }
  .hdr-text { display: flex; flex-direction: column; gap: 4px; }
  .ring-track { stroke: var(--border); }
  .ring-arc { stroke: var(--accent); }
  .hdr-eyebrow { margin: 0; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-strong); font-weight: 800; }
  .hdr-title { margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.15; }
  .hdr-tagline { margin: 0; font-size: 17px; color: var(--muted); }

  /* --- summary tiles --- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; }
  .tile-num { display: flex; align-items: center; gap: 10px; font-size: 38px; font-weight: 800; line-height: 1.1; }
  .tile-need { color: var(--accent-strong); }
  .tile-ready { color: var(--ok-strong); }
  .tile-external { color: var(--external); }
  .tile-idle { color: var(--idle); }
  .tile-running { color: var(--text); }
  .tile-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--ok); }
  .tile-label { font-size: 16px; font-weight: 700; }
  .tile-sub { font-size: 14px; color: var(--muted); }

  /* --- lens switch + legend --- */
  .lens-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
  .lens-pills { display: inline-flex; background: var(--lens-track); border: 1px solid var(--border); border-radius: 999px; padding: 4px; gap: 4px; }
  .lens-btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border: none; border-radius: 999px; background: none; color: var(--text); font: 700 15px var(--sans); cursor: pointer; }
  .lens-btn:hover { background: var(--border); }
  .lens-btn.active { background: var(--lens-active-bg); color: var(--lens-active-fg); }
  .chip-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; color: var(--muted); }

  /* --- chips (one vocabulary; see CHIPS in render.mjs) --- */
  .chip { display: inline-flex; align-items: center; font: 800 13px var(--sans); letter-spacing: .04em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: var(--inset); color: var(--muted); }
  .chip-you { background: var(--chip-you-bg); color: var(--chip-you-fg); }
  .chip-merge { background: var(--chip-merge-bg); color: var(--chip-merge-fg); }
  .chip-ready { background: var(--chip-ready-bg); color: var(--chip-ready-fg); }
  .chip-external { background: var(--chip-external-bg); color: var(--chip-external-fg); }
  .chip-idle, .chip-muted { background: var(--chip-idle-bg); color: var(--chip-idle-fg); }
  .chip-error { background: var(--danger); color: var(--on-danger); }
  .chip-current { background: var(--chip-ready-bg); color: var(--chip-ready-fg); }

  /* --- action-queue rows (layout restyled in 014-02) --- */
  .queue-list { display: flex; flex-direction: column; }
  .queue-group { border-top: 1px solid var(--border); }
  .queue-group:first-child { border-top: none; }
  .queue-group-header { padding: 12px 26px 4px; font: 800 13px var(--sans); letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
  .queue-row { display: flex; align-items: center; gap: 14px; padding: 12px 26px; border-top: 1px solid var(--border); cursor: pointer; }
  .queue-row:first-of-type { border-top: none; }
  .queue-row:hover { background: var(--inset); }
  .queue-project { font: 800 17px var(--sans); }
  .queue-action { font: 400 15px var(--sans); }
  .summary-band { display: flex; justify-content: space-between; align-items: center; padding: 22px 26px; border-bottom: 1px solid var(--border); }
  .summary-path { font: 13px var(--mono); color: var(--muted); }
  .summary-title { font: 800 21px/1.2 var(--sans); margin-top: 4px; }
  .summary-right { display: flex; align-items: center; gap: 18px; }
  .running-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-right: 6px; animation: cpulse 1.8s ease-in-out infinite; }
  @keyframes cpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  /* --- overview rows --- */
  .overview-list { min-width: 1000px; }
  .sheet-scroll { overflow-x: auto; }
  .col-header, .project-row { display: grid; grid-template-columns: 230px minmax(300px, 1fr) 140px 180px 160px; column-gap: 24px; padding: 16px 26px; }
  .col-header { border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .project-list { display: flex; flex-direction: column; }
  .project-row { align-items: center; padding-top: 20px; padding-bottom: 20px; border-top: 1px solid var(--border); cursor: pointer; }
  .col-header + .project-list > .project-row:first-child { border-top: none; }
  .project-row:hover { background: var(--inset); }
  .project-row.row-owner { background: var(--row-owner); }
  .project-row.row-idle { background: var(--row-idle); }
  .project-row.row-owner:hover, .project-row.row-idle:hover { background: var(--inset); }
  .row-project { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .row-name { font: 800 19px/1.25 var(--sans); }
  .row-type { font: 400 15px var(--sans); color: var(--muted); }
  .row-nextmove { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .row-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .row-action { font: 700 17px/1.35 var(--sans); color: var(--text); }
  .row-action.muted { color: var(--muted); font-weight: 600; }
  .row-wait { font-size: 15px; color: var(--muted); }
  .row-inflight { display: flex; flex-direction: column; gap: 2px; }
  .if-num { font: 800 24px/1.1 var(--sans); }
  .if-word { font-size: 14px; color: var(--muted); }
  .heat-clear { color: var(--heat-clear); }
  .heat-light { color: var(--heat-light); }
  .heat-busy { color: var(--heat-busy); }
  .heat-hot { color: var(--heat-hot); }
  .row-progress { display: flex; flex-direction: column; gap: 6px; }
  .pct-line { display: flex; align-items: baseline; gap: 8px; }
  .row-progress .pct { font: 800 19px var(--sans); }
  .row-progress .caption { font-size: 14px; color: var(--muted); }
  .pbar-track { height: 8px; border-radius: 999px; background: var(--border); overflow: hidden; }
  .pbar-fill { height: 8px; border-radius: 999px; background: var(--accent); }
  .pbar-fill.full { background: var(--ok); }
  .row-activity { display: flex; flex-direction: column; gap: 3px; }
  .act-primary { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
  .run-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--dot-off); }
  .run-dot.on { background: var(--ok); }
  .act-last { font-size: 14px; color: var(--muted); }
  .overview-hint { margin: 0; font-size: 15px; color: var(--muted); }

  /* Waiting-on verb badge: still used by the action-queue rows (014-02). */
  .row-verb { display: inline-block; font: 800 13px var(--sans); letter-spacing: .04em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; }
  .rv-DECIDE, .rv-REVIEW { background: var(--chip-you-bg); color: var(--chip-you-fg); }
  .rv-MERGE, .rv-Ready { background: var(--chip-ready-bg); color: var(--chip-ready-fg); }
  .rv-External { background: var(--chip-external-bg); color: var(--chip-external-fg); }

  /* Spec 009-04: detail-view open-PR list. */
  .prs { margin-top: 14px; }
  .pr-row { display: flex; align-items: baseline; gap: 9px; padding: 3px 0; font: 12px var(--mono); }
  .pr-link { color: var(--blue); text-decoration: none; }
  .pr-title { color: var(--text-subhead); }
  .pr-hint { color: var(--text-faint); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; }
  .flight-cells { display: block; }

  /* --- detail view --- */
  .detail { background: var(--sheet); }
  .topbar { background: var(--topbar); padding: 13px 26px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
  .back-btn { border-radius: 5px; padding: 5px 11px; }
  .crumb { font: 12px var(--mono); color: var(--text-subhead); }
  .header { padding: 24px 26px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 18px; }
  .detail-title-line { display: flex; align-items: center; gap: 12px; }
  .detail-title { font: 600 25px var(--sans); color: var(--text-hi); }
  .detail-type { font: 11px var(--mono); color: var(--text-muted); }
  .detail-meta { margin-top: 9px; font: 12px var(--mono); color: var(--text-label); }
  .tabs { margin-top: 14px; display: flex; gap: 2px; }
  .tab { font: 12.5px var(--mono); padding: 9px 16px; border-bottom: 2px solid transparent; color: var(--text-dimmer); cursor: pointer; }
  .tab.active { color: var(--text-hi); border-bottom-color: var(--amber); }
  .progress-readout { text-align: right; }
  .readout-text { font: 13px var(--mono); color: var(--text-bright); }

  .whats-next { padding: 20px 26px; border-bottom: 1px solid var(--border-soft); }
  .wn-header { display: flex; justify-content: space-between; align-items: baseline; }
  .wn-header .label, .label { font: 10px var(--mono); letter-spacing: 0.14em; color: var(--text-label); text-transform: uppercase; }
  .wn-header .age { font: 11px var(--mono); color: var(--text-label); }
  .wn-header .age.stale { color: var(--stale); }
  .wn-line { font: 16px/1.5 var(--sans); color: var(--text-body); max-width: 960px; margin-top: 6px; }
  .wn-line.muted { color: var(--text-muted); }
  .wn-next { margin-top: 8px; font: 14px var(--sans); color: var(--text-bright); }
  .wn-blocked { margin-top: 10px; background: var(--blocked-bg); border: 1px solid var(--blocked-border); border-radius: 6px; padding: 11px 14px; font: 14px var(--sans); color: var(--red-soft); }
  .label-inline { font: 11px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--green); margin-right: 6px; }
  .wn-blocked .label-inline { color: var(--red); }

  .counts-line { padding: 14px 26px; border-bottom: 1px solid var(--border-soft); font: 12.5px var(--mono); color: var(--text-muted); }

  .two-col { display: grid; grid-template-columns: 1.35fr 1fr; gap: 1px; background: var(--track); border-bottom: 1px solid var(--border); }
  .specs-panel, .ws-panel { background: var(--sheet); padding: 20px 26px; }
  .specs-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .track-label, .specs-toggle { font: 11px var(--mono); color: var(--link); cursor: pointer; }
  .spec-row { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 14px; padding: 8px 0; align-items: center; }
  .spec-n { font: 12.5px var(--mono); color: var(--text-label); }
  .spec-name { font: 13.5px var(--mono); color: var(--text-hi); }
  .spec-name.dim { color: var(--text-dimmer); }
  .spec-slices { font: 12.5px var(--mono); color: var(--text-muted); }
  .spec-status { font: 11px var(--mono); }
  .st-DONE { color: var(--green); } .st-IN_PROGRESS { color: var(--blue); }
  .st-DRAFT { color: var(--draft); } .st-ABANDONED { color: var(--abandoned); }
  .st-DEFERRED { color: var(--text-dimmer); }

  .ws-block { border-top: 1px solid var(--border-soft); padding: 12px 0; }
  .ws-block:first-of-type { border-top: none; }
  .ws-title-line { display: flex; align-items: center; gap: 12px; }
  .ws-title { font: 500 14px var(--sans); color: var(--text-body); }
  .ws-kind { font: 10.5px var(--mono); color: var(--purple); letter-spacing: 0.03em; }
  .ws-goal { margin-top: 8px; }
  .ws-goal-line { display: flex; align-items: center; gap: 10px; }
  .ws-goal-text { font: 11px var(--mono); color: var(--text-item); }
  .ws-goal-next { margin-top: 6px; font: 13px var(--sans); color: var(--text-bright); }
  .ws-items { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .ws-item { font: 13px var(--sans); color: var(--text-item); }
  .discovered { margin-top: 12px; border-top: 1px solid var(--border-soft); padding-top: 12px; }
  .discovered-line { font: 13px var(--sans); color: var(--text-muted); }

  .sessions { padding: 20px 26px; border-bottom: 1px solid var(--border-soft); }
  .sessions-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .sessions-header .meta { font: 12px var(--mono); color: var(--text-muted); }
  .session-row { display: grid; grid-template-columns: 18px 1.3fr 1.4fr 1fr auto; column-gap: 14px; padding: 9px 0; border-top: 1px solid var(--border-soft); align-items: center; }
  .session-row.older { opacity: 0.72; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; }
  .dot-run { background: var(--green); animation: cpulse 1.8s ease-in-out infinite; }
  .dot-idle { background: var(--dot-off); }
  .dot-hollow { background: transparent; border: 1px solid var(--dot-border); }
  .sr-title { font: 13.5px var(--sans); color: var(--text-hi); }
  .sr-branch { font: 12px var(--mono); color: var(--link); }
  .sr-worktree { font: 12px var(--mono); color: var(--text-muted); }
  .sr-last { font: 12px var(--mono); color: var(--text-label); text-align: right; }
  .sessions-toggle summary { cursor: pointer; margin-top: 8px; font: 12px var(--mono); color: var(--link); list-style: none; }
  .sessions-toggle summary::-webkit-details-marker { display: none; }

  .warning { padding: 14px 26px; background: var(--warn-bg); border-bottom: 1px solid var(--border-soft); }
  .warning { font: 13.5px var(--sans); color: var(--warn-text); }
  .warning-eg { font: 12px var(--mono); color: var(--text-muted); margin-top: 4px; }

  /* Reserved Activity tab (AC6) — inert, dashed placeholder. */
  .activity-tab-content { padding: 60px 26px; text-align: center; }
  .activity-icon { width: 52px; height: 52px; margin: 0 auto 14px; border: 1px dashed var(--border-dash); border-radius: 12px; }
  .activity-heading { font: 16px var(--sans); color: var(--text-bright); }
  .evo-chart, .evo-empty, .evo-skipped { margin: 0 auto 26px; max-width: 560px; text-align: left; font: 12.5px var(--sans); color: var(--text-muted); }
  .evo-svg { display: block; max-width: 100%; height: auto; }
  .evo-key { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; font: 11px var(--mono); }
  .evo-key-item { display: inline-flex; align-items: center; gap: 5px; }
  .evo-swatch { display: inline-block; width: 14px; height: 3px; border-radius: 2px; }
  .evo-caption { margin-top: 6px; font: 11px var(--mono); }
  .evo-skipped { margin-top: -14px; font-size: 11.5px; }
  .activity-desc { margin-top: 6px; font: 12.5px var(--sans); color: var(--text-muted); }

  /* --- 012-01 roadmap tab (existing tokens only; chips differ by hue AND label) --- */
  .roadmap-tab-content { padding: 20px 26px; }
  .roadmap-tab-content[hidden] { display: none; }
  .rm-header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .rm-asof { font: 12px var(--mono); color: var(--text-muted); }
  .rm-hint { font: 12px var(--mono); color: var(--link); }
  .rm-sequence { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 6px; }
  .rm-step { flex: 1 1 200px; min-width: 0; background: var(--inset); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
  .rm-step-label { display: block; font: 10.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); }
  .rm-step-title { display: block; margin-top: 4px; font: 13px var(--sans); color: var(--text-hi); overflow-wrap: anywhere; }
  .rm-step-parked .rm-step-label { color: var(--text-dimmer); }
  .rm-release, .rm-spec-group { margin-top: 18px; }
  .rm-group-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 8px; }
  .rm-group-id { font: 12.5px var(--mono); color: var(--text-label); }
  .rm-group-name { font: 500 15px var(--sans); color: var(--text-hi); overflow-wrap: anywhere; }
  .rm-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .rm-card { min-width: 0; background: var(--sheet); border: 1px solid var(--border-strong); border-radius: 6px; padding: 10px 12px; }
  .rm-card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .rm-card-id { font: 12px var(--mono); color: var(--text-label); }
  .rm-card-name { margin-top: 6px; font: 13.5px var(--sans); color: var(--text-body); overflow-wrap: anywhere; }
  .rm-card-goal { margin-top: 4px; font: 12.5px var(--sans); color: var(--text-muted); overflow-wrap: anywhere; }
  .rm-card-parked { border-style: dashed; }
  .rm-trigger { margin-top: 6px; font: 12px var(--sans); color: var(--text-label); overflow-wrap: anywhere; }
  .rm-parked { margin-top: 20px; }
  .rm-deps { margin-top: 6px; font: 11.5px var(--mono); color: var(--text-muted); overflow-wrap: anywhere; }
  .rm-chip { font: 10.5px var(--mono); padding: 2px 8px; border-radius: 10px; border: 1px solid currentColor; white-space: nowrap; }
  .chip-done { color: var(--green); }
  .chip-progress { color: var(--blue); background: var(--inset); }
  .chip-planned { color: var(--draft); border-style: dashed; }
  .chip-parked { color: var(--stale); border-style: dotted; }
  .rm-empty { margin-top: 16px; font: 14px var(--sans); color: var(--text-muted); }
  .roadmap-done { margin-top: 20px; }
  .roadmap-done summary { cursor: pointer; font: 12px var(--mono); color: var(--link); }
  @media (max-width: 600px) {
    .rm-cards { grid-template-columns: 1fr; }
    .roadmap-tab-content { padding: 16px 14px; }
  }
</style>
</head>
<body>
<div class="toolbar"><span class="meta" id="scanned"></span><button id="refresh">refresh</button></div>
<div id="app"><div class="sheet"><p class="err" style="color:var(--text-muted)">scanning…</p></div></div>
<script type="module">
import * as R from './render.mjs';

const app = document.getElementById('app');
const scannedEl = document.getElementById('scanned');

// App state — kept in the same shape render.mjs's pure detail-state helpers
// use (view/path/showAll), so the click glue below is a thin dispatcher over
// tested pure functions, not ad hoc DOM bookkeeping (plan.md's testability
// decision; AC4).
let state = { ...R.OVERVIEW_STATE };
let projects = [];
let generatedAt = null;
let summary = null; // 014-01: scanner-side tile counts

function overviewHtml() {
  // Spec 009-02 AC2: finish-first ordering — MERGE > REVIEW > DECIDE >
  // Ready(resume) > Ready(start) > External > Idle, via each project's
  // waitingOn.rank (derived scan-side, src/lib.mjs's deriveWaitingOn).
  const rows = R.sortProjectsByWaitingOn(projects).map(R.overviewRow).join('');
  // Spec 014-01: header + five tiles + lens switch + chip legend; all counts
  // come from the scanner-side `summary` (ADR-0001, the page derives nothing).
  return `${R.headerHtml(summary)}
    ${R.summaryTilesHtml(summary)}
    <div class="lens-row">${R.lensToggleHtml('overview')}${R.chipLegendHtml()}</div>
    <section class="sheet sheet-scroll" aria-label="Projects"><div class="overview-list">
      <div class="col-header"><span>Project</span><span>Next move</span><span>In flight</span><span>Progress</span><span>Activity</span></div>
      <div class="project-list">${rows || '<p style="padding:20px 26px;color:var(--muted)">No projects configured.</p>'}</div>
    </div></section>
    <p class="overview-hint">Click a project to open its detail page.</p>`;
}

function render() {
  if (state.view === 'detail') {
    const p = projects.find((pr) => pr.path === state.path);
    app.innerHTML = p ? R.detailView(p, { showAll: state.showAll, tab: state.tab }) : overviewHtml();
    if (!p) state = R.closeDetail(state.lens);
  } else if (state.lens === 'queue') {
    // Spec 009-03: the cross-project action-queue lens — flattens each
    // project's waitingStages (finish-first, capped) into stage rows, the
    // "empty the pipeline" screen alongside the projects-as-rows grid.
    app.innerHTML = R.actionQueueHtml(projects);
  } else {
    app.innerHTML = overviewHtml();
  }
}

app.addEventListener('click', (e) => {
  const back = e.target.closest('[data-action="back"]');
  // Preserve the active lens across the detail round-trip (openDetail/
  // closeDetail carry it through the pure layer) so closing a project opened
  // from the queue returns to the queue, not silently back to the grid.
  if (back) { state = R.closeDetail(state.lens); render(); return; }
  const lensToggle = e.target.closest('[data-action="set-lens-queue"], [data-action="set-lens-overview"]');
  if (lensToggle) {
    state = R.setLens(state, lensToggle.dataset.action === 'set-lens-queue' ? 'queue' : 'overview');
    render();
    return;
  }
  const toggle = e.target.closest('[data-action="show-all-specs"], [data-action="show-track-specs"]');
  if (toggle) { state = { ...state, showAll: toggle.dataset.action === 'show-all-specs' }; render(); return; }
  // 012-01 AC1: tabs are app state (state.tab), applied by a re-render
  // through detailView — so the /api/prs fold-in (which re-renders
  // wholesale) can never reset the open tab.
  const tabBtn = e.target.closest('[data-action="show-overview-tab"], [data-action="show-roadmap-tab"], [data-action="show-activity-tab"]');
  if (tabBtn) {
    state = { ...state, tab: tabBtn.dataset.action.replace(/^show-/, '').replace(/-tab$/, '') };
    render();
    return;
  }
  const row = e.target.closest('.project-row, .queue-row');
  if (row) { state = R.openDetail(row.dataset.path, state.lens); render(); return; }
});

// Spec 010-01 (ADR-0007): phase one — disk-only, never blocks on gh. Renders
// immediately, then fires phase two (loadPrs) to fold PR states in without
// making the caller (the click handler / setInterval) wait on gh.
async function load() {
  const res = await fetch('/api/data');
  const data = await res.json();
  if (data.error) {
    app.innerHTML = `<div class="sheet"><p class="err">${R.esc(data.error)}</p></div>`;
    return;
  }
  projects = data.projects;
  summary = data.summary || null;
  generatedAt = data.generatedAt;
  scannedEl.textContent = 'scanned ' + new Date(generatedAt).toLocaleString();
  render();
  loadPrs();
}

// Phase two: fetch the gh-enriched PR deltas and fold them into the
// already-rendered model. Any failure (gh absent/unauthenticated/offline/
// hanging, a non-ok response, a network error) is swallowed here — the disk
// render from phase one stands unchanged, no error surfaced (AC4). Never
// lets phase two throw out of load().
async function loadPrs() {
  // The open detail tab lives in `state.tab` (012-01 AC1), which the wholesale
  // phase-two re-render below does not touch — nothing to capture/restore.
  // Narrow the swallow to the NETWORK phase only (craft nit): a gh-absent /
  // offline / timeout / non-ok /api/prs must degrade silently to the disk
  // render (AC4), but a genuine bug in mergePrDeltas or render() below must
  // NOT be hidden — it reaches the console like any other programming error.
  let prs;
  try {
    const res = await fetch('/api/prs');
    if (!res.ok) return;
    prs = await res.json();
  } catch {
    return; // gh absent/offline/timeout, or a thrown fetch — disk page stands.
  }
  if (!prs || prs.error) return;
  projects = R.mergePrDeltas(projects, prs.projects);
  // 014-01: swap the four state tiles from the gh-enriched summary; Running
  // now keeps the /api/data value (a failed /api/prs never reaches here).
  summary = R.mergePrSummary(summary, prs.summary);
  render();
}

document.getElementById('refresh').addEventListener('click', load);
load();
setInterval(load, 120000);
</script>
</body>
</html>
